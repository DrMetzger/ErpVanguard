name: VPS

# Executa tarefas na VPS via SSH. Disparado manualmente (aba Actions ou API).
on:
  workflow_dispatch:
    inputs:
      task:
        description: Tarefa
        type: choice
        options: [status, setup]
        default: status

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Configure os secrets VPS_HOST e VPS_SSH_KEY em Settings > Secrets and variables > Actions"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          # Keys pasted from a Windows terminal often arrive with CRLF, trailing
          # spaces or all on one line; rebuild the standard PEM layout.
          python3 - <<'PY'
          import os, re
          raw = os.environ["VPS_SSH_KEY"].replace("\r", "")
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          if not m:
              raise SystemExit("::error::VPS_SSH_KEY não contém as linhas BEGIN/END da chave privada")
          body = re.sub(r"\s+", "", m.group(2))
          lines = [body[i:i + 70] for i in range(0, len(body), 70)]
          key = f"-----BEGIN {m.group(1)}-----\n" + "\n".join(lines) + f"\n-----END {m.group(1)}-----\n"
          path = os.path.expanduser("~/.ssh/id_ed25519")
          with open(path, "w") as f:
              f.write(key)
          os.chmod(path, 0o600)
          PY
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "::error::VPS_SSH_KEY está incompleta ou corrompida. Copie de novo o bloco inteiro de ~/.ssh/github_actions"
            exit 1
          fi
          echo "Chave carregada: $(ssh-keygen -l -f ~/.ssh/id_ed25519)"
          ssh-keyscan -T 15 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Status
        if: inputs.task == 'status'
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          echo "== Sistema";  . /etc/os-release; echo "$PRETTY_NAME"; uptime
          echo "== CPU/RAM";  nproc; free -h
          echo "== Disco";    df -h /
          echo "== Firewall"; sudo ufw status 2>/dev/null || true
          echo "== Docker";   docker --version 2>/dev/null && docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || echo "Docker não instalado"
          REMOTE

      - name: Setup
        if: inputs.task == 'setup'
        run: ssh "$VPS_USER@$VPS_HOST" 'sudo bash -s' < infra/vps-setup.sh
