name: VPS

# Executa tarefas na VPS via SSH. Disparado manualmente (aba Actions ou API).
on:
  workflow_dispatch:
    inputs:
      task:
        description: Tarefa
        type: choice
        options: [status, setup, ai-check, users, diag, caddy-files, restore-caddy]
        default: status

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.IP_VM }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.USER_VM || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST || secrets.IP_VM }}
          key: ${{ secrets.VPS_SSH_KEY }}
          user: ${{ secrets.VPS_USER || secrets.USER_VM || 'root' }}
          password: ${{ secrets.PSW_VM }}

      - name: Status
        if: inputs.task == 'status'
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          echo "== Sistema";  . /etc/os-release; echo "$PRETTY_NAME"; uptime
          echo "== CPU/RAM";  nproc; free -h
          echo "== Disco";    df -h /
          echo "== Firewall"; sudo ufw status 2>/dev/null || true
          echo "== Docker";   docker --version 2>/dev/null && docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || echo "Docker não instalado"
          echo "== Saúde (de dentro do servidor)"
          for c in vanguard-api-1:3000 vanguard-control-1:3100; do
            n=${c%:*}; p=${c#*:}
            printf '%s: ' "$n"; sudo docker exec "$n" wget -qO- "http://127.0.0.1:$p/api/health" < /dev/null 2>&1 || echo "(sem resposta)"; echo
          done
          printf 'Painel pelo 127.0.0.1:3100: '; curl -s -m 5 http://127.0.0.1:3100/api/health || echo "(sem resposta)"; echo
          echo "== Agente"; systemctl is-active vanguard-agent.service 2>/dev/null; sudo journalctl -u vanguard-agent.service -n 5 --no-pager -o cat 2>/dev/null
          for n in vanguard-api-1 vanguard-control-1 vanguard-web-1; do echo "== Últimas linhas: $n"; sudo docker logs --tail 15 "$n" 2>&1 | grep -v RouterExplorer | tail -12; done
          REMOTE

      - name: Diag
        if: inputs.task == 'diag'
        run: |
          # Somente leitura: quem usa as portas 80/443 e quais sites existem na VPS.
          ssh "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          echo "== Portas"; ss -ltnp | grep -E ':(80|443|8[0-9]{3}|3[0-9]{3}|5[0-9]{3}) ' || true
          echo "== Containers"; docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Label "com.docker.compose.project"}}'
          echo "== Projetos compose"; docker compose ls -a
          echo "== Serviços web"; for s in nginx apache2 httpd caddy traefik; do printf '%s: ' $s; systemctl is-active $s 2>/dev/null || true; done
          echo "== nginx sites"; ls -la /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null; grep -rn "server_name\|proxy_pass\|listen" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -40
          echo "== Pastas"; ls -la /opt /srv /var/www 2>/dev/null
          echo "== grep suporte"; timeout 5 grep -rlI --exclude-dir=node_modules --exclude-dir=.git "suporte.primeerp" /etc /opt /srv /root /home 2>/dev/null | grep -v '/opt/vanguard/app' | head -20
          echo "== Últimos eventos docker"; timeout 5 docker events --since 3h --until "$(date +%s)" --filter type=container --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' 2>/dev/null | grep -vE 'exec_|health' | tail -40
          echo "== Containers parados (criados/encerrados)"; docker ps -a --filter status=exited --format '{{.Names}} {{.Image}} {{.Status}}'
          echo "== Logs web"; docker logs --tail 30 vanguard-web-1 2>&1 | grep -i "suporte\|error" | tail -15
          echo "== primehub"; ls -la /opt/primehub; for f in /opt/primehub/docker-compose.yml /opt/primehub/*.caddy /opt/primehub/Caddyfile* /opt/primehub/*.md; do [ -f "$f" ] && { echo "--- $f"; sed -E 's/(PASS|SECRET|TOKEN|KEY)([A-Z_]*)[=:].*/\1\2=<oculto>/I' "$f" | head -80; }; done
          echo "== grep vanguard em primehub"; timeout 8 grep -rnI --exclude-dir=node_modules --exclude-dir=.git -E "vanguard|caddy|suporte\.primeerp" /opt/primehub 2>/dev/null | grep -viE "pass|secret|token" | head -40
          echo "== Redes"; docker network ls; for c in primehub-web vanguard-web-1; do echo "$c: $(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' $c)"; done
          echo "== Caddyfile no container"; docker exec vanguard-web-1 cat /etc/caddy/Caddyfile | grep -nE "^\S|suporte|reverse_proxy|import" | head -40
          echo "== Arquivos extras em /opt/vanguard"; ls -la /opt/vanguard /opt/vanguard/app /opt/vanguard/app/web 2>/dev/null
          echo "== backups de Caddyfile"; timeout 15 find /opt /root /home /etc -maxdepth 5 -name "Caddyfile*" -not -path "*/node_modules/*" 2>/dev/null | head -20
          echo "== histórico"; grep -hE "Caddyfile|network connect|suporte|primehub" /root/.bash_history /home/*/.bash_history 2>/dev/null | tail -40
          REMOTE

      - name: Caddy files
        if: inputs.task == 'caddy-files'
        run: |
          # Somente leitura: cópias do Caddyfile salvas pelo instalador do primehub.
          ssh "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          for f in /opt/primehub/migracao/Caddyfile.novo /opt/primehub/migracao/Caddyfile.atual /opt/primehub/migracao/Caddyfile.original; do
            echo "=================== $f ($(stat -c '%y' "$f"))"; cat "$f"
          done
          echo "=================== instalar.sh (trecho do Caddy)"; sed -n 60,140p /opt/primehub/app.anterior/deploy/vm/instalar.sh
          echo "=================== caddy-protheus.sh"; cat /opt/primehub/app.anterior/deploy/protheus/caddy-protheus.sh
          ls -la /opt/primehub /opt/primehub/migracao
          REMOTE

      - name: Restore Caddy (Prime Hub)
        if: inputs.task == 'restore-caddy'
        run: |
          # Recoloca no Caddy do vanguard o bloco do Prime Hub (suporte/protheus) salvo pelo instalador
          # do primehub. Valida antes; se o Caddy recusar, volta a configuração anterior. Sem reiniciar.
          ssh "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          src=/opt/primehub/migracao/Caddyfile.novo
          bloco=$(awk '/^# >>> Prime Hub/{p=1} p' "$src")
          [ -n "$bloco" ] || { echo "bloco do Prime Hub não encontrado em $src"; exit 1; }
          docker cp vanguard-web-1:/etc/caddy/Caddyfile /tmp/Caddyfile.atual
          { awk '/^# >>> Prime Hub/{exit} {print}' /tmp/Caddyfile.atual; echo; echo "$bloco"; } > /tmp/Caddyfile.novo
          docker cp /tmp/Caddyfile.novo vanguard-web-1:/etc/caddy/Caddyfile
          if docker exec vanguard-web-1 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 \
             && docker exec vanguard-web-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
            echo "Caddy recarregado com o bloco do Prime Hub"
            cp /tmp/Caddyfile.novo /opt/vanguard/app/web/Caddyfile
          else
            echo "Caddy recusou; voltando a configuração anterior"
            docker cp /tmp/Caddyfile.atual vanguard-web-1:/etc/caddy/Caddyfile
            docker exec vanguard-web-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            exit 1
          fi
          sleep 5
          for u in https://suporte.primeerp.com.br/ https://suporte.primeerp.com.br/painel https://protheus.primeerp.com.br/ https://app.erpvanguard.com.br/api/health https://admin.erpvanguard.com.br/api/health; do
            printf '%s: ' "$u"; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 60 "$u" || true
          done
          REMOTE

      - name: Users
        if: inputs.task == 'users'
        run: |
          # Só e-mail, perfil e situação (nunca senha).
          ssh "$VPS_USER@$VPS_HOST" 'sudo docker exec -i vanguard-db-1 psql -X -U vanguard -d vanguard' <<'SQL'
          SELECT email, role, active, created_at, last_login_at, two_factor_email IS NOT NULL AS email_codigo FROM users ORDER BY created_at;
          SELECT name FROM migrations ORDER BY id DESC LIMIT 3;
          SELECT key, value FROM app_settings WHERE key = 'security';
          SELECT u.email, c.created_at, c.used, c.attempts FROM login_codes c JOIN users u ON u.id = c.user_id ORDER BY c.id DESC LIMIT 5;
          SQL
          ssh "$VPS_USER@$VPS_HOST" 'sudo docker logs --since 2h vanguard-api-1 2>&1 | grep -iE "login|código|Entrada|error" | tail -20'

      - name: Setup
        if: inputs.task == 'setup'
        run: ssh "$VPS_USER@$VPS_HOST" 'sudo bash -s' < infra/vps-setup.sh

      - name: AI check
        if: inputs.task == 'ai-check'
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'cd /opt/vanguard/app/infra && sudo docker compose --env-file /opt/vanguard/.env exec -T api node -' <<'JS'
          const { matchWithGemini, aiEnabled } = require('/app/dist/purchasing/gemini.js')
          const { config } = require('/app/dist/config.js')

          async function main() {
            if (!aiEnabled()) throw new Error('GEMINI_API_KEY não configurada no servidor')
            console.log('Modelo configurado:', config.geminiModel)

            const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': config.geminiApiKey } })
            const d = await r.json()
            const names = (d.models ?? []).filter((m) => (m.supportedGenerationMethods ?? []).includes('generateContent')).map((m) => m.name.replace('models/', ''))
            console.log('Modelos disponíveis para esta chave:', names.join(', ') || JSON.stringify(d).slice(0, 300))

            const items = [
              { itemNumber: 1, description: 'PARAF SEXT ZB 5X30MM', supplierCode: 'PX530', ean: null, ncm: '73181500', unit: 'UN' },
              { itemNumber: 2, description: 'TINTA ACRIL BCA NEVE 18LT', supplierCode: 'T18', ean: null, ncm: '32091010', unit: 'LT' },
              { itemNumber: 3, description: 'CAFE TORRADO 500G', supplierCode: 'CF5', ean: null, ncm: '09012100', unit: 'PC' },
            ]
            const candidates = [
              { id: 'p1', sku: 'PAR-530', name: 'Parafuso sextavado zincado 5x30mm', ncm: '73181500', unit: 'UN' },
              { id: 'p2', sku: 'TIN-18', name: 'Tinta acrílica branco neve 18L', ncm: '32091010', unit: 'UN' },
              { id: 'p3', sku: 'LUV-01', name: 'Luva nitrílica caixa 100', ncm: '40151900', unit: 'CX' },
            ]
            const result = await matchWithGemini(items, candidates)
            console.log(JSON.stringify(result, null, 2))
            const got = Object.fromEntries(result.map((m) => [m.itemNumber, m.productId]))
            if (got[1] !== 'p1' || got[2] !== 'p2' || got[3]) throw new Error('IA respondeu, mas diferente do esperado')
            console.log('IA OK: amarrou parafuso e tinta, e deixou o café sem produto')
          }
          main().catch((e) => { console.error('Falha:', e.message); process.exit(1) })
          JS
