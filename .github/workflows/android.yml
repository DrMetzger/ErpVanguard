name: Android

# Gera o app Android (espelho do ERP web, ligado ao servidor app.erpvanguard.com.br).
# A cada mudança em web/ ou mobile/: compila o APK de teste, publica em
# https://app.erpvanguard.com.br/download/ e guarda como artifact. Com os secrets da
# chave de upload, gera também o AAB assinado para a Play Store.
on:
  push:
    branches: [main, claude/keen-dirac-i5mx15]
    paths:
      - 'web/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web and sync Capacitor
        run: |
          # Versão embutida no app (o app compara com a publicada para avisar de atualização).
          printf '{"version":"%s","name":"%s","builtAt":"%s"}\n' "${GITHUB_SHA::12}" "$VERSION_NAME" "$(date -u +%FT%TZ)" > web/public/version.json
          npm ci --prefix web
          npm ci --prefix mobile
          cd mobile && npm run sync

      - name: Debug APK (teste)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Signed release (Play Store)
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem a chave de upload (ANDROID_KEYSTORE_BASE64): gerando só o APK de teste."
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon bundleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Prepare download page
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/erp-vanguard.apk
          cp web/public/version.json out/version.json
          size=$(du -h out/erp-vanguard.apk | cut -f1)
          cat > out/index.html <<HTML
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ERP Vanguard · App Android</title>
          <style>body{font-family:system-ui,sans-serif;background:#0b1120;color:#e5e7eb;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
          .c{max-width:460px;text-align:center}a.b{display:inline-block;background:#f59e0b;color:#111;font-weight:700;padding:14px 22px;border-radius:10px;text-decoration:none;margin:18px 0}
          small{color:#94a3b8;line-height:1.6}</style></head><body><div class="c">
          <h1>ERP Vanguard</h1><p>App Android · versão $VERSION_NAME ($size)</p>
          <a class="b" href="erp-vanguard.apk">Baixar o app (APK)</a>
          <p><small>No Android, permita "instalar apps desconhecidos" para o navegador quando pedir.<br>
          Para atualizar, baixe de novo e instale por cima: os dados continuam.</small></p></div></body></html>
          HTML

      - name: Configure SSH
        id: ssh
        continue-on-error: true
        uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}

      - name: Publish on app.erpvanguard.com.br/download
        if: steps.ssh.outcome == 'success'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "sudo install -d /opt/vanguard/downloads"
          rsync -az --rsync-path="sudo rsync" out/ "$VPS_USER@$VPS_HOST:/opt/vanguard/downloads/"
          echo "APK publicado: https://app.erpvanguard.com.br/download/"

      - uses: actions/upload-artifact@v4
        with:
          name: erp-vanguard-${{ env.VERSION_NAME }}-teste-apk
          path: out/erp-vanguard.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: hashFiles('mobile/android/app/build/outputs/bundle/release/*.aab') != ''
        with:
          name: erp-vanguard-${{ env.VERSION_NAME }}-playstore-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
