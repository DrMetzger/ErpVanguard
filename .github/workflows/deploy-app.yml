name: Deploy ERP

on:
  push:
    branches: [main, claude/magical-archimedes-fsrqy8, claude/keen-dirac-i5mx15]
    paths:
      - 'api/**'
      - 'web/**'
      - 'infra/docker-compose.yml'
      - 'infra/backup.sh'
      - 'infra/restore.sh'
      - 'infra/agent.sh'
      - '.github/workflows/deploy-app.yml'
      - '.github/actions/vps-ssh/**'
  workflow_dispatch:

concurrency:
  group: vps
  cancel-in-progress: false

env:
  APP_DOMAIN: app.erpvanguard.com.br
  APP_DIR: /opt/vanguard

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.IP_VM }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.USER_VM || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST || secrets.IP_VM }}
          key: ${{ secrets.VPS_SSH_KEY }}
          user: ${{ secrets.VPS_USER || secrets.USER_VM || 'root' }}
          password: ${{ secrets.PSW_VM }}

      - name: Prepare VPS (first time)
        run: |
          # VM nova: instala Docker, firewall (22/80/443), swap e fuso horário. Depois só confere.
          if ssh "$VPS_USER@$VPS_HOST" "command -v docker >/dev/null && docker compose version >/dev/null 2>&1"; then
            echo "Docker já instalado: VPS pronta"
          else
            echo "Docker não encontrado: preparando a VPS (infra/vps-setup.sh)"
            ssh "$VPS_USER@$VPS_HOST" 'sudo bash -s' < infra/vps-setup.sh
          fi

      - name: Upload source
        run: |
          ssh "$VPS_USER@$VPS_HOST" "command -v rsync >/dev/null || sudo apt-get install -y -q rsync; sudo install -d $APP_DIR/app"
          rsync -az --delete --rsync-path="sudo rsync" \
            --exclude node_modules --exclude dist \
            api web infra "$VPS_USER@$VPS_HOST:$APP_DIR/app/"

      - name: Keep other sites in Caddy (Prime Hub)
        run: |
          # O Caddy do vanguard (portas 80/443) também atende sites de outros sistemas da VM
          # (suporte.primeerp.com.br e protheus.primeerp.com.br, do /opt/primehub). O bloco deles fica
          # entre "# >>> Prime Hub" e "# <<< Prime Hub"; o rsync acima trouxe o Caddyfile do repositório
          # sem ele, então o bloco é recolocado aqui antes do build. Sem isso o deploy derruba esses sites.
          ssh "$VPS_USER@$VPS_HOST" "sudo APP_DIR=$APP_DIR bash -s" <<'REMOTE'
          set -euo pipefail
          f="$APP_DIR/app/web/Caddyfile"
          bloco=""
          # 1) o que está no ar agora; 2) a última configuração gerada pelo instalador do primehub
          if docker ps --format '{{.Names}}' | grep -qx vanguard-web-1; then
            bloco=$(docker exec vanguard-web-1 cat /etc/caddy/Caddyfile 2>/dev/null | awk '/^# >>> Prime Hub/{p=1} p' || true)
          fi
          if [ -z "$bloco" ] && [ -f /opt/primehub/migracao/Caddyfile.novo ]; then
            bloco=$(awk '/^# >>> Prime Hub/{p=1} p' /opt/primehub/migracao/Caddyfile.novo)
          fi
          if [ -n "$bloco" ]; then
            { awk '/^# >>> Prime Hub/{exit} {print}' "$f"; echo; echo "$bloco"; } > "$f.tmp" && mv "$f.tmp" "$f"
            echo "Bloco do Prime Hub mantido no Caddyfile: $(echo "$bloco" | grep -cE '^[a-z0-9.-]+ \{') site(s)"
          else
            echo "Nenhum site extra no Caddy"
          fi
          REMOTE

      - name: Panel secrets
        run: |
          # Senhas do painel geradas no próprio servidor, uma única vez (antes de qualquer docker compose).
          ssh "$VPS_USER@$VPS_HOST" "sudo APP_DIR=$APP_DIR bash -s" <<'REMOTE'
          set -euo pipefail
          f="$APP_DIR/.env"
          [ -f "$f" ] || exit 0
          umask 077
          grep -q '^CONTROL_DB_PASSWORD=' "$f" || echo "CONTROL_DB_PASSWORD=$(openssl rand -hex 24)" >> "$f"
          grep -q '^CONTROL_SECRET=' "$f" || echo "CONTROL_SECRET=$(openssl rand -hex 48)" >> "$f"
          grep -q '^AGENT_TOKEN=' "$f" || echo "AGENT_TOKEN=$(openssl rand -hex 32)" >> "$f"
          chmod 600 "$f"
          echo "Senhas do painel conferidas"
          REMOTE

      - name: Backup before update
        run: |
          # Cópia do banco antes de subir a versão nova (migrações); não trava o deploy na primeira vez.
          ssh "$VPS_USER@$VPS_HOST" "if sudo docker ps --format {{.Names}} | grep -q vanguard-db; then sudo KIND=predeploy APP_DIR=$APP_DIR bash $APP_DIR/app/infra/backup.sh; else echo Banco ainda não está rodando; fi"

      - name: Sync optional secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY$GEMINI_MODEL" ]; then echo "Sem GEMINI_API_KEY: IA desativada"; exit 0; fi
          # A chave vai em base64 dentro do script enviado pelo stdin do SSH:
          # não aparece em linha de comando nem no log.
          key_b64=$(printf %s "$GEMINI_API_KEY" | base64 -w0)
          ssh "$VPS_USER@$VPS_HOST" "sudo bash -s" <<EOF
          set -e
          umask 077
          f=$APP_DIR/.env
          touch \$f
          if [ -n "$key_b64" ]; then sed -i '/^GEMINI_API_KEY=/d' \$f; echo "GEMINI_API_KEY=\$(echo $key_b64 | base64 -d)" >> \$f; fi
          if [ -n "$GEMINI_MODEL" ]; then sed -i '/^GEMINI_MODEL=/d' \$f; echo "GEMINI_MODEL=$GEMINI_MODEL" >> \$f; fi
          EOF
          echo "Configuração do Gemini atualizada no servidor"

      - name: Sync e-mail (SMTP) secrets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          # Só informa QUAIS existem (nunca os valores).
          for k in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
            if [ -n "${!k}" ]; then echo "$k: cadastrado"; else echo "$k: não cadastrado"; fi
          done
          if [ -z "$SMTP_HOST" ]; then echo "Sem SMTP_HOST nos secrets: vale a configuração da tela (Administração › Configurações)"; exit 0; fi
          # Valores em base64 dentro do script enviado pelo stdin do SSH: não aparecem em linha de comando nem no log.
          b() { printf %s "$1" | base64 -w0; }
          ssh "$VPS_USER@$VPS_HOST" "sudo bash -s" <<EOF
          set -e
          umask 077
          f=$APP_DIR/.env
          touch \$f
          put() { sed -i "/^\$1=/d" \$f; [ -n "\$2" ] && echo "\$1=\$(echo \$2 | base64 -d)" >> \$f || true; }
          put SMTP_HOST "$(b "$SMTP_HOST")"
          put SMTP_PORT "$(b "$SMTP_PORT")"
          put SMTP_USER "$(b "$SMTP_USER")"
          put SMTP_PASS "$(b "$SMTP_PASS")"
          put SMTP_FROM "$(b "$SMTP_FROM")"
          EOF
          echo "Configuração de e-mail atualizada no servidor"

      - name: Build and start
        run: |
          ssh "$VPS_USER@$VPS_HOST" "sudo APP_DIR=$APP_DIR APP_DOMAIN=$APP_DOMAIN bash -s" <<'REMOTE'
          set -euo pipefail
          env_file="$APP_DIR/.env"

          # Senhas geradas uma única vez, no próprio servidor. Nunca aparecem no log.
          if [ ! -f "$env_file" ]; then
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "JWT_SECRET=$(openssl rand -hex 48)"
              echo "ADMIN_EMAIL=admin@erpvanguard.com.br"
              echo "ADMIN_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-16)"
            } > "$env_file"
            echo "Arquivo $env_file criado com senhas novas"
          fi
          grep -q '^APP_DOMAIN=' "$env_file" || echo "APP_DOMAIN=$APP_DOMAIN" >> "$env_file"
          # Painel: senhas próprias, geradas aqui uma única vez (banco do painel, assinatura do login, senha do agente).
          ( umask 077
            grep -q '^CONTROL_DB_PASSWORD=' "$env_file" || echo "CONTROL_DB_PASSWORD=$(openssl rand -hex 24)" >> "$env_file"
            grep -q '^CONTROL_SECRET=' "$env_file" || echo "CONTROL_SECRET=$(openssl rand -hex 48)" >> "$env_file"
            grep -q '^AGENT_TOKEN=' "$env_file" || echo "AGENT_TOKEN=$(openssl rand -hex 32)" >> "$env_file" )
          chmod 600 "$env_file"

          cd "$APP_DIR/app/infra"
          # Banco do painel: usuário sem privilégios, dono só do vanguard_control.
          # (< /dev/null: o docker compose não pode ler a entrada, que é este próprio script)
          docker compose --env-file "$env_file" up -d db < /dev/null
          for i in $(seq 1 30); do docker compose --env-file "$env_file" exec -T db pg_isready -U vanguard -d vanguard < /dev/null > /dev/null 2>&1 && break; sleep 2; done
          cdbpass=$(sed -n 's/^CONTROL_DB_PASSWORD=//p' "$env_file" | tail -1)
          docker compose --env-file "$env_file" exec -T db psql -X -q -U vanguard -d vanguard -v ON_ERROR_STOP=1 <<SQL
          SELECT 'CREATE ROLE vg_control LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vg_control')
          \\gexec
          ALTER ROLE vg_control PASSWORD '$cdbpass';
          SELECT 'CREATE DATABASE vanguard_control OWNER vg_control' WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'vanguard_control')
          \\gexec
          -- Cada banco só abre para o próprio dono (clientes não enxergam o ERP principal nem o painel).
          REVOKE CONNECT ON DATABASE vanguard FROM PUBLIC;
          REVOKE CONNECT ON DATABASE vanguard_control FROM PUBLIC;
          SQL

          # Pasta do APK (workflow Android) servida em /download
          install -d "$APP_DIR/downloads"
          docker compose --env-file "$env_file" up -d --build --remove-orphans < /dev/null
          docker image prune -f > /dev/null

          echo "Aguardando a API..."
          for i in $(seq 1 30); do
            if docker exec vanguard-api-1 wget -qO- http://127.0.0.1:3000/api/health < /dev/null 2>/dev/null; then
              echo; docker compose --env-file "$env_file" ps < /dev/null
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file "$env_file" logs --tail 80 api < /dev/null
          exit 1
          REMOTE

      - name: Daily backup (02:00 Brasília, 14 days)
        run: |
          ssh "$VPS_USER@$VPS_HOST" "sudo APP_DIR=$APP_DIR bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 755 "$APP_DIR/bin"
          install -m 750 "$APP_DIR/app/infra/backup.sh" "$APP_DIR/bin/backup.sh"
          install -m 750 "$APP_DIR/app/infra/restore.sh" "$APP_DIR/bin/restore.sh"
          cat > /etc/systemd/system/vanguard-backup.service <<UNIT
          [Unit]
          Description=Backup diário do ERP Vanguard
          After=docker.service
          [Service]
          Type=oneshot
          Environment=APP_DIR=$APP_DIR
          ExecStart=/usr/bin/bash $APP_DIR/bin/backup.sh
          UNIT
          cat > /etc/systemd/system/vanguard-backup.timer <<UNIT
          [Unit]
          Description=Backup diário do ERP Vanguard às 02:00 (Brasília)
          [Timer]
          OnCalendar=*-*-* 02:00:00 America/Sao_Paulo
          Persistent=true
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now vanguard-backup.timer >/dev/null
          # Primeiro backup na hora, se ainda não houver nenhum.
          ls "$APP_DIR"/backups/vanguard-*.dump >/dev/null 2>&1 || systemctl start vanguard-backup.service
          echo "Próximo backup: $(systemctl show vanguard-backup.timer -p NextElapseUSecRealtime --value)"
          echo "Último: $(ls -1t "$APP_DIR"/backups/vanguard-*.dump 2>/dev/null | head -1 | xargs -r basename) · guardados: $(ls -1 "$APP_DIR"/backups/vanguard-*.dump 2>/dev/null | wc -l)"
          journalctl -u vanguard-backup.service -n 3 --no-pager -o cat || true
          REMOTE

      - name: Panel agent
        run: |
          # Agente fixo da VPS: busca a fila do painel pelo 127.0.0.1 e executa só a lista fechada de ações.
          ssh "$VPS_USER@$VPS_HOST" "sudo APP_DIR=$APP_DIR bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 755 "$APP_DIR/bin"
          install -d -m 700 "$APP_DIR/tenants"
          install -m 750 "$APP_DIR/app/infra/agent.sh" "$APP_DIR/bin/agent.sh"
          cat > /etc/systemd/system/vanguard-agent.service <<UNIT
          [Unit]
          Description=Agente do painel da Prime ERP (pedidos do admin.erpvanguard.com.br)
          After=docker.service
          Requires=docker.service
          [Service]
          Environment=APP_DIR=$APP_DIR
          Environment=DOCKER_CONFIG=$APP_DIR/.docker
          ExecStart=/usr/bin/bash $APP_DIR/bin/agent.sh
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=full
          ReadWritePaths=$APP_DIR
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable vanguard-agent.service > /dev/null
          systemctl restart vanguard-agent.service
          sleep 3
          systemctl is-active vanguard-agent.service
          journalctl -u vanguard-agent.service -n 3 --no-pager -o cat || true
          REMOTE

      - name: Check public URL
        run: |
          # Na primeira vez o Caddy ainda está emitindo o certificado HTTPS.
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://$APP_DOMAIN/api/health"; then
              echo; echo "ERP no ar: https://$APP_DOMAIN"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::API está rodando na VPS, mas https://$APP_DOMAIN ainda não respondeu (DNS ou certificado)"
          ssh "$VPS_USER@$VPS_HOST" "cd $APP_DIR/app/infra && sudo docker compose --env-file $APP_DIR/.env logs --tail 40 web" || true

      - name: Check admin URL
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://admin.erpvanguard.com.br/api/health" | grep -q '"status":"ok"'; then echo; echo "Painel no ar com HTTPS: https://admin.erpvanguard.com.br"; exit 0; fi
            sleep 6
          done
          echo "::error::O painel não respondeu em https://admin.erpvanguard.com.br/api/health"
          ssh "$VPS_USER@$VPS_HOST" "cd $APP_DIR/app/infra && sudo docker compose --env-file $APP_DIR/.env ps; sudo docker compose --env-file $APP_DIR/.env logs --tail 40 control web" || true
          exit 1

      - name: Check other sites (Prime Hub)
        run: |
          # Os sites do Prime Hub atendidos por este Caddy precisam continuar no ar depois do deploy.
          sites=$(ssh "$VPS_USER@$VPS_HOST" "sudo docker exec vanguard-web-1 cat /etc/caddy/Caddyfile" | awk '/^# >>> Prime Hub/{p=1} p && /^[a-z0-9.-]+ \{/{print $1}')
          [ -n "$sites" ] || { echo "Nenhum site extra no Caddy"; exit 0; }
          fail=0
          for s in $sites; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "https://$s/" || echo erro)
            echo "$s: $code"
            case "$code" in 2*|3*|401|403) ;; *) fail=1 ;; esac
          done
          [ $fail = 0 ] || { echo "::error::Algum site do Prime Hub não respondeu depois do deploy"; exit 1; }

      - name: Check e-mail (SMTP)
        run: |
          # Conecta e faz login no SMTP, sem enviar e-mail; a senha nunca aparece.
          ssh "$VPS_USER@$VPS_HOST" "cd $APP_DIR/app/infra && sudo docker compose --env-file $APP_DIR/.env exec -T api node dist/tools/smtp-check.js" || true
