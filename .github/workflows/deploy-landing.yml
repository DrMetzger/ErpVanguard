name: Deploy landing page

on:
  push:
    branches: [main, claude/keen-dirac-i5mx15]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Check FTP secrets
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes em Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Build
        working-directory: landing
        run: |
          npm ci
          npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to public_html
        run: |
          host="${FTP_SERVER#ftp://}"; host="${host#ftps://}"; host="${host%/}"
          # Shared hosting certificates rarely match the FTP hostname, so TLS is
          # used when offered but the certificate is not verified.
          settings="set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30"

          dir="$FTP_SERVER_DIR"
          if [ -z "$dir" ]; then
            # A cPanel account lands in the home dir (public_html is a subfolder);
            # an FTP account scoped to the site lands directly inside public_html.
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "$settings; cls -1 -a; bye" "$host" | grep -qx 'public_html/\?'; then
              dir="public_html"
            else
              dir="."
            fi
          fi
          echo "Enviando para: $dir"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "$settings; mirror --reverse --verbose --no-perms landing/dist $dir; bye" "$host"
