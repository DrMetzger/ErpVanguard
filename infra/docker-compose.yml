# Sobe o ERP Vanguard: PostgreSQL + API + web (Caddy com HTTPS).
# Variáveis vêm de /opt/vanguard/.env (gerado no primeiro deploy).
name: vanguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanguard
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard -d vanguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vanguard:${POSTGRES_PASSWORD}@db:5432/vanguard
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@erpvanguard.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MEDIA_DIR: /data/media
      TZ: America/Sao_Paulo
    volumes:
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy

  # Painel da Prime ERP (admin.erpvanguard.com.br). Sem acesso ao Docker nem ao servidor:
  # só grava pedidos; quem executa é o agente da VPS (infra/agent.sh) pelo 127.0.0.1:3100.
  control:
    build: ../api
    restart: unless-stopped
    command: ["node", "dist/control/main.js"]
    environment:
      CONTROL_DATABASE_URL: postgres://vg_control:${CONTROL_DB_PASSWORD:?}@db:5432/vanguard_control
      CONTROL_SECRET: ${CONTROL_SECRET:?}
      AGENT_TOKEN: ${AGENT_TOKEN:?}
      CONTROL_OWNER_EMAIL: ${CONTROL_OWNER_EMAIL:-kleber.farias@primeerp.com.br}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3100:3100"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.erpvanguard.com.br}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ${APP_DIR:-/opt/vanguard}/downloads:/download:ro
    depends_on:
      - api
      - control

volumes:
  db-data:
  media-data:
  caddy-data:
  caddy-config:
